
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PharmaAI - Evolução Farmacêutica</title>
    <link rel="manifest" href="manifest.json">
