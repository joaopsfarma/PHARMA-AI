
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PharmaAI - Evolução Farmacêutica</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e40af">
    <script>
      // Garante que o objeto process exista para evitar erros fatais de JS no navegador
      window.process = { env: { API_KEY: "" } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "@google/genai": "https://esm.sh/@google/genai@1.42.0",
    "lucide-react": "https://esm.sh/lucide-react@0.460.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
    <style>
      /* Estilo para a tela de carregamento inicial */
      #loading-screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background-color: #f8fafc;
        font-family: sans-serif;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #e2e8f0;
        border-top: 4px solid #2563eb;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 1rem;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased h-screen overflow-hidden">
    <div id="root">
      <div id="loading-screen">
        <div class="spinner"></div>
        <p style="color: #64748b; font-weight: 500;">Inicializando PharmaAI...</p>
        <p style="color: #94a3b8; font-size: 12px; margin-top: 8px;">Isso pode levar alguns segundos no primeiro acesso</p>
      </div>
    </div>
    
    <!-- O script principal. Note que em ambientes de produção real (Netlify), 
         o ideal é que este arquivo seja um .js transpilado. 
         Mas para este ambiente, mantemos a compatibilidade. -->
    <script type="module" src="index.tsx"></script>
    
    <script>
      // Registro do Service Worker apenas se suportado e em HTTPS
      if ('serviceWorker' in navigator && window.location.protocol === 'https:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(err => console.error('SW error:', err));
        });
      }
    </script>
  </body>
</html>
